name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (defaults to the current ref)'
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish store artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate
        run: bun run validate

      - name: Build Chromium (MV3)
        run: bun run deploy-v3

      - name: Verify and package Chromium (MV3)
        run: |
          bun ./tools/verifyBuild.js
          bun run package

      - name: Build Firefox (MV2)
        run: bun run deploy-v2

      - name: Verify and package Firefox (MV2)
        run: |
          bun ./tools/verifyBuild.js
          bun run package

      - name: Checksums
        run: |
          cd artifacts
          sha256sum *.zip | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: store-artifacts
          path: artifacts/

      - name: Attach artifacts to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          draft: true
          generate_release_notes: true
